      if (c.layout === "long") { document.title = `${i.name} — PISTON`; renderFurniture(i, c); return; }
      const L = { cta: "Build Your Production Line", procT: "TYPICAL PRODUCTION PROCESS", solT: "RECOMMENDED PISTON SOLUTION", detailT: "VIEW DETAILED SOLUTION", expBtn: "Get a Custom Solution", appsT: "APPLICATIONS", ...c.labels };
      const A = `assets/img/industry/${slug}/`;
      const name = i.name;
      const known = (id) => id && D.products.some((p) => p.id === id);
      const href = (id) => (known(id) ? `product.html?id=${id}` : "products.html");
      const ids = c.sol.map((s) => s[0]).filter(known).join(",");
      const cols = (n, gap) => Array(n).fill("1fr").join(` ${gap}px `);
      document.title = `${name} — PISTON`;

      qs("#page").innerHTML = `
      <section class="id-hero" style="height:${c.heroH || 257}px;--hh:${c.heroH || 257}">
        <img src="${A}hero.png" alt="${esc(name)} — Why Piston: high precision, maximum productivity, reliable &amp; durable, global support">
        <div class="container">
          <div class="breadcrumb"><a href="index.html">Home</a><span>›</span><a href="industries.html">Industries &amp; Solutions</a><span>›</span>${esc(name)}</div>
          <span class="ey">${esc(name)}</span>
          <h1>Complete Solutions for<br>${esc(name)}</h1>
          <p>${esc(c.lead)}</p>
          <div class="acts">
            <button class="btn btn-red" data-quote-add="${ids}" data-go="1">${L.cta} <span>→</span></button>
            <button class="btn btn-w" onclick="P.toast('Brochure PDF — demo')">Download Brochure <span>⤓</span></button>
          </div>
        </div>
      </section>

      <div class="container">
        <nav class="id-tabs">${D.industries.map((x) => `<a class="${x.slug === slug ? "on" : ""}" href="${IND[x.slug] ? "industry" : "industries"}.html?slug=${x.slug}"><img src="assets/img/industry/${x.slug === slug ? `${slug}/tab-on` : `tabs/off-${x.slug}`}.png" alt="">${esc(x.name)}</a>`).join("")}</nav>

        <section class="id-row1">
          <div class="id-box id-about">
            <h3>ABOUT ${esc(name.toUpperCase())}</h3>
            <p>${esc(c.about)}</p>
            <img src="${A}about.png" alt="${esc(name)}">
            <div class="id-feat">${c.features.map(([t, d], n) => `<div><img src="${A}f-${n + 1}.png" alt=""><span><b>${t}</b><small>${d}</small></span></div>`).join("")}</div>
          </div>
          <div class="id-box">
            <h3>${L.procT}</h3>
            <div class="id-proc" style="grid-template-columns:repeat(${c.proc.length},1fr)">${c.proc.map(([t, d], n) => `<div><div class="ic"><img src="${A}p-${n + 1}.png" alt=""><span>${n + 1}</span></div><b>${t}</b><small>${d}</small></div>`).join("")}</div>
            <h3>${L.solT}</h3>
            <div class="id-sol" style="grid-template-columns:${cols(c.sol.length, 26)}">${c.sol.map(([id, m, t], n) => `${n ? '<span class="arr">→</span>' : ""}<a href="${href(id)}"><div class="im"><img src="${A}s-${n + 1}.png" alt="${m}"></div><b>${m}</b><small>${t}</small></a>`).join("")}</div>
            <a class="id-detail${c.bar ? " bar" : ""}" href="industries.html?slug=${slug}">${L.detailT} &nbsp;→</a>
          </div>
          <div class="id-box id-ben">
            <h3>KEY BENEFITS</h3>
            ${c.benefits.map(([v, l], n) => `<div class="r"><img src="${A}b-${n + 1}.png" alt=""><span><b>${v}</b><small>${l}</small></span></div>`).join("")}
            <div class="id-exp">
              <h3>TALK TO AN EXPERT</h3>
              <div class="row"><img src="${A}expert.png" alt="Piston engineer"><div><p>${esc(c.expert)}</p><a class="btn btn-red" href="talk-to-engineer.html?type=custom">${L.expBtn} &nbsp;→</a></div></div>
            </div>
          </div>
        </section>

        <section class="id-row2">
          <div class="id-box id-apps"><h3>${L.appsT}</h3>
            <div class="row">${c.apps.map((a, n) => `<div><img src="${A}a-${n + 1}.png" alt=""><b>${a}</b></div>`).join("")}</div></div>
          <div class="id-box id-story"><h3>SUCCESS STORIES</h3>
            <div class="card2"><img src="${A}story.png" alt="${esc(c.story[0])}"><div><b>${esc(c.story[0])}</b><p>${esc(c.story[1])}</p><a href="case-study.html?id=${c.story[2]}">VIEW CASE STUDY &nbsp;→</a></div></div></div>
          <div class="id-box id-pop"><h3>${L.popT || `POPULAR MACHINES FOR ${esc(name.toUpperCase())}`}<a href="products.html">View All Machines</a></h3>
            <div class="row" style="grid-template-columns:${cols(c.pop.length, 30)}">${c.pop.map(([id, m, t], n) => `${n ? '<span class="arr">→</span>' : ""}<a href="${href(id)}"><div class="im"><img src="${A}m-${n + 1}.png" alt="${m}"></div><b>${m}</b><small>${t}</small></a>`).join("")}</div></div>
        </section>
      </div>`;
    });
  </script>
</body>
</html>
