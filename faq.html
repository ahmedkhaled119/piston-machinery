<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frequently Asked Questions — PISTON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body.wide .fq-c { padding: 0 58px 0 42px; }
    .fq-head { line-height: 1.35; }
    .fq-crumb { display: flex; gap: 8px; font-size: 13px; color: #444; padding-top: 24px; margin-left: -2px; }
    .fq-crumb a:hover { color: var(--red); }
    .fq-crumb b { color: #111; font-weight: 600; }
    .fq-head h1 { font-family: var(--font); font-weight: 700; font-size: 43px; line-height: 1; letter-spacing: -.2px; color: #111; margin: 27px 0 0 -4px; }
    .fq-head p { font-size: 18px; color: #222; margin: 14px 0 0 -4px; }
    .fq-grid { display: grid; grid-template-columns: 242px 683px 1fr; gap: 0 38px; margin: 52px 0 42px; line-height: 1.35; }
    .fq-grid > h2 { grid-column: 1; font-family: var(--font); font-size: 16px; font-weight: 700; letter-spacing: .3px; color: #111; margin: 0 0 0 2px; align-self: center; }
    .fq-search { grid-column: 2 / 4; display: flex; align-items: center; height: 40px; border: 1px solid #e3e4e7; border-radius: 4px; padding: 0 14px 0 17px; background: #fff; }
    .fq-search input { flex: 1; border: 0; outline: none; font: inherit; font-size: 14px; color: #111; background: none; }
    .fq-search input::placeholder { color: #777; }
    .fq-search svg { width: 17px; height: 17px; color: #777; }
    .fq-search:focus-within { border-color: var(--red); }
    .fq-box { background: #fff; border: 1px solid #ececef; border-radius: 4px; margin-top: 8px; align-self: start; }
    .fq-cats { padding: 4px 0; }
    .fq-cats button { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 42px; padding: 0 16px 0 22px; background: none; border: 0; border-left: 2px solid transparent; font: inherit; font-size: 15px; color: #222; text-align: left; cursor: pointer; }
    .fq-cats button::after { content: "›"; color: #999; font-size: 16px; }
    .fq-cats button:hover { color: var(--red); }
    .fq-cats button.on { background: #fdf0f0; color: var(--red); font-weight: 600; border-left-color: var(--red); }
    .fq-cats button.on::after { content: ""; }
    .fq-cats small { color: #888; font-size: 11.5px; font-weight: 400; margin-left: auto; margin-right: 10px; }
    .fq-cats button.on small { color: var(--red); }
    .fq-list { padding: 0 0 4px; }
    .fq-item + .fq-item { border-top: 1px solid #f0f0f2; }
    .fq-q { display: flex; justify-content: space-between; align-items: center; gap: 20px; width: 100%; min-height: 46px; padding: 0 44px 0 34px; background: none; border: 0; font: inherit; font-size: 16.5px; font-weight: 600; color: #111; text-align: left; cursor: pointer; }
    .fq-q::after { content: "+"; color: var(--red); font-size: 20px; font-weight: 400; line-height: 1; flex: none; }
    .fq-q:hover { color: var(--red); }
    .fq-item.open .fq-q { color: var(--red); }
    .fq-item.open .fq-q::after { content: "−"; }
    .fq-a { display: none; padding: 0 44px 16px 34px; font-size: 15px; line-height: 1.6; color: #333; }
    .fq-item.open .fq-a { display: block; }
    .fq-a a { color: var(--red); }
    .fq-a .tag { display: inline-block; margin-top: 8px; font-size: 11.5px; color: #777; }
    .fq-empty { padding: 26px 34px; font-size: 13.5px; color: #333; }
    .fq-empty a { color: var(--red); }
    .fq-mark { background: #ffe7a3; color: inherit; padding: 0; }
    .fq-help { position: relative; overflow: hidden; padding: 30px 30px 34px 34px; min-height: 330px; }
    .fq-help h3 { font-family: var(--font); font-size: 18px; font-weight: 700; letter-spacing: .2px; color: #111; margin: 0; }
    .fq-help p { font-size: 15.5px; line-height: 26px; color: #333; margin: 16px 0 0; max-width: 275px; }
    .fq-help .btn { width: 253px; height: 47px; margin-top: 22px; font-size: 13.5px; letter-spacing: .6px; position: relative; z-index: 1; }
    .fq-help .wa { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; font-weight: 600; color: #111; position: relative; z-index: 1; }
    .fq-help .wa svg { width: 17px; height: 17px; color: #1faa53; }
    .fq-help .wa:hover { color: var(--red); }
    .fq-help > svg { position: absolute; right: 18px; bottom: 14px; width: 92px; height: 92px; color: #ebebee; }
    /* Desktop-only footer tweaks; below 1281px the shared responsive footer takes over. */
    @media (min-width: 1281px) {
    body.wide.fq-page .site-footer { font-size: 14px; line-height: 1.45; padding-top: 26px; }
    body.wide.fq-page .footer-grid { grid-template-columns: 1.5fr 1fr 1.15fr .95fr 1.05fr 1.45fr; gap: 20px; }
    body.wide.fq-page .footer-grid > div + div { border-left: 1px solid #25272c; padding-left: 18px; }
    body.wide.fq-page .footer-grid h4 { font-size: 14px; margin-bottom: 8px; }
    body.wide.fq-page .footer-grid a { padding: 2px 0; }
    body.wide.fq-page .footer-about p { font-size: 13.5px; margin: 12px 0 16px; }
    body.wide.fq-page .footer-bottom { font-size: 13.5px; margin-top: 16px; padding: 14px 0; }
    }
    @media (max-width: 1200px) {
      body.wide .fq-c { padding: 0 20px; }
      .fq-grid { grid-template-columns: 1fr; gap: 12px; }
      .fq-grid > h2, .fq-search { grid-column: auto; }
      .fq-help { min-height: 0; }
    }
    @media (max-width: 760px) {
      .fq-head h1 { font-size: 30px; line-height: 1.1; margin-left: 0; }
      .fq-head p { font-size: 16px; margin-left: 0; }
      .fq-grid { margin: 28px 0 32px; }
      .fq-cats { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
      .fq-cats button { width: auto; height: 36px; padding: 0 12px; border: 1px solid #ececef; border-radius: 18px; font-size: 14px; }
      .fq-cats button.on { border-color: var(--red); }
      .fq-cats button::after { content: none; }
      .fq-cats small { margin: 0 0 0 6px; }
      .fq-q { padding: 10px 16px; font-size: 15.5px; }
      .fq-a { padding: 0 16px 14px; font-size: 14.5px; }
      .fq-empty { padding: 20px 16px; }
      .fq-help { padding: 22px 16px 26px; }
      .fq-help .btn { width: 100%; }
      .fq-help > svg { width: 64px; height: 64px; }
    }
  </style>
</head>
<body class="wide fq-page" data-nav="support" data-footer="plain">
  <div id="site-header"></div>

  <main class="container fq-c">
    <section class="fq-head">
      <nav class="fq-crumb" aria-label="Breadcrumb"><a href="index.html">Home</a>›<a href="support.html">Support</a>›<b>FAQ</b></nav>
      <h1>FREQUENTLY ASKED QUESTIONS</h1>
      <p>Find quick answers to the most common questions.</p>
    </section>

    <section class="fq-grid">
      <h2>CATEGORIES</h2>
      <label class="fq-search"><input id="q" type="search" placeholder="Search questions..." aria-label="Search questions" autocomplete="off"><svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></label>
      <nav class="fq-box fq-cats" id="cats" aria-label="FAQ categories"></nav>
      <div class="fq-box fq-list" id="list" aria-live="polite"></div>
      <aside class="fq-box fq-help">
        <h3>STILL NEED HELP?</h3>
        <p>Can't find what you're looking for? Our support team is ready to assist you.</p>
        <a class="btn btn-red" href="technical-support.html">CONTACT SUPPORT</a>
        <a class="wa" href="#" data-wa-quote data-channel="support" data-source="FAQ — Still need help" id="wa"></a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.7-2 2.5-5 2.5"/></svg>
      </aside>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("piston:ready", () => {
      const { D, qs, qsa, esc, param, icon } = P;
      const CATS = ["General", "Installation", "Operation", "Maintenance", "Troubleshooting", "Spare Parts", "Warranty & Service"];
      // Data-store categories -> page categories (in production the Admin assigns these directly).
      const MAP = { Machines: "General", Quotes: "General", Warranty: "Warranty & Service", "Spare Parts": "Spare Parts", Service: "Warranty & Service" };
      const catOf = (f) => (/install/i.test(f.q) ? "Installation" : /remote|troubleshoot/i.test(f.q) ? "Troubleshooting" : MAP[f.cat] || "General");
      // Demo-only extra questions shown in the mockup; real content comes from the Admin FAQ manager.
      const EXTRA = [
        { cat: "General", q: "How do I register my Piston machine?", a: "No online account is needed. Send your machine model, serial number, invoice date and company details through the <a href=\"technical-support.html\">Technical Support form</a> or WhatsApp, and we register the machine for warranty and service." },
        { cat: "Maintenance", q: "How often should I perform maintenance?", a: "Follow the schedule in your machine's Maintenance Guide: daily cleaning and dust extraction checks, weekly lubrication of guides and rails, and a full preventive service by a Piston technician at the interval stated for your model." },
        { cat: "Maintenance", q: "What type of oil should I use?", a: "Use only the lubricant grades listed in your machine's Maintenance Guide. If you are unsure, send your model and serial number to our support team and we will confirm the right product." },
        { cat: "Spare Parts", q: "How can I order spare parts?", a: "Find the part in the <a href=\"spare-parts.html\">Spare Parts catalog</a> and add it to your request. Quotes are sent through WhatsApp by our spare parts team — please have your machine serial number ready." },
        { cat: "Operation", q: "How can I update my machine software?", a: "Control software updates are installed by our engineers, on site or remotely. Contact <a href=\"technical-support.html\">Technical Support</a> with your model and serial number to check if an update is available." },
        { cat: "Operation", q: "Where can I find the user manual for my machine?", a: "Manuals, installation guides and electrical diagrams are in the <a href=\"support.html#res\">Support Center</a> — select your machine to see its documents." },
        { cat: "Installation", q: "What do I need to prepare before installation?", a: "Our team sends a site-preparation sheet with the order: floor space and levelling, power supply, compressed air and dust extraction requirements for your machines." },
        { cat: "Troubleshooting", q: "My machine shows an error code. What should I do?", a: "Stop the machine safely, note the error code and check the Troubleshooting Guide for your model. If the problem continues, send the code and a photo of the control panel to our support team." }
      ];
      const ORDER = ["How do I register my Piston machine?", "Where do I find my machine's serial number?", "How often should I perform maintenance?", "What type of oil should I use?",
        "How can I order spare parts?", "What warranty do you offer?", "How can I update my machine software?"];
      const rank = (f) => { const i = ORDER.indexOf(f.q); return i < 0 ? 99 : i; };
      const ALL = D.faq.map((f) => ({ c: catOf(f), q: f.q, a: esc(f.a) })).concat(EXTRA.map((f) => ({ c: f.cat, q: f.q, a: f.a })))
        .map((f, i) => ({ ...f, i })).sort((x, y) => rank(x) - rank(y) || x.i - y.i);

      let cat = CATS.find((c) => c.toLowerCase().replace(/\W+/g, "-") === param("cat")) || "";
      qs("#q").value = param("q") || "";

      const hl = (text, term) => {
        const t = esc(text);
        if (!term) return t;
        const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
        return t.replace(re, '<mark class="fq-mark">$1</mark>');
      };
      function render() {
        const term = qs("#q").value.trim();
        const t = term.toLowerCase();
        const hits = ALL.filter((f) => !t || f.q.toLowerCase().includes(t) || f.a.replace(/<[^>]+>/g, "").toLowerCase().includes(t));
        const count = (c) => hits.filter((f) => !c || f.c === c).length;
        qs("#cats").innerHTML = [["", "All Questions"]].concat(CATS.map((c) => [c, c]))
          .map(([v, l]) => `<button type="button" class="${v === cat ? "on" : ""}" data-c="${esc(v)}">${esc(l)}${t ? `<small>${count(v)}</small>` : ""}</button>`).join("");
        const list = hits.filter((f) => !cat || f.c === cat);
        qs("#list").innerHTML = list.length ? list.map((f) => `<div class="fq-item"><button type="button" class="fq-q" aria-expanded="false"><span>${hl(f.q, term)}</span></button>
          <div class="fq-a">${f.a}<br><span class="tag">${esc(f.c)}</span></div></div>`).join("")
          : `<div class="fq-empty">No questions match “${esc(term)}”${cat ? ` in ${esc(cat)}` : ""}. Try another word or <a href="technical-support.html">contact our support team</a>.</div>`;
      }
      qs("#cats").onclick = (e) => { const b = e.target.closest("[data-c]"); if (b) { cat = b.dataset.c; render(); } };
      qs("#q").oninput = render;
      qs("#list").onclick = (e) => {
        const b = e.target.closest(".fq-q");
        if (!b) return;
        const it = b.parentElement.classList.toggle("open");
        b.setAttribute("aria-expanded", it);
      };
      qs("#wa").innerHTML = `${icon("wa")}Or chat with us on WhatsApp`;
      render();
    });
  </script>
</body>
</html>
