<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — PISTON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Responsive overrides of global .pd-* / .rel / .duo-dark (desktop ≥1440 untouched) */
    @media (max-width: 1420px) {
      .rel .nav-arrow.l { left: -14px; }
      .rel .nav-arrow.r { right: -14px; }
    }
    @media (max-width: 1100px) {
      .pd-top { gap: 30px; }
      .pd-top > div, .pd-row > div { min-width: 0; }
      .pd-info .desc { max-width: none; }
      .rel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .duo-dark > div + div { border-left: 0; border-top: 1px solid #26282d; }
      .pd-tabs { gap: 20px; padding: 0 14px; }
      .pd-tabs a { flex: none; white-space: nowrap; }
    }
    @media (max-width: 760px) {
      .pd-info h1 { font-size: 36px; }
      .pd-info .sub { font-size: 18px; margin-bottom: 16px; }
      .pd-btns { flex-wrap: wrap; margin: 24px 0; }
      .pd-btns .btn { flex: 1 1 200px; padding: 14px 18px; }
      .pd-badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .pd-thumbs { gap: 8px; }
      .pd-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 18px 0; }
      .pd-strip > div:nth-child(odd) { border-left: 0; }
      .pd-strip b { font-size: 17px; }
      .pd-box { padding: 20px 18px; }
      .pd-meta div { padding: 14px 12px; gap: 10px; }
      .pd-viewer { min-height: 360px; }
      .pd-viewer .stage { inset: 64px 10px 88px; }
      .pd-tools { top: auto; bottom: 12px; left: 50%; transform: translateX(-50%); flex-direction: row; gap: 6px; }
      .pd-tools button { width: 54px; height: 60px; font-size: 10.5px; gap: 4px; }
      .pd-tools button img { width: 20px; height: 20px; }
      .pd-mode { top: 14px; right: 14px; gap: 6px; }
      .pd-mode button { padding: 8px 14px; }
      .pd-full { top: 14px; left: 14px; right: auto; bottom: auto; }
      .spec2 { padding: 6px 10px; gap: 0; }
      .spec2 div { gap: 12px; }
      .apps6 { gap: 14px; }
      .apps6 div { gap: 10px; }
      .rel .nav-arrow { display: none; }
      .rel-grid { gap: 12px; }
      .rel-card { padding: 12px; }
      .rel-card img { height: 110px; }
      .duo-dark > div { flex-wrap: wrap; padding: 24px 22px; }
      .duo-dark p { max-width: none; }
      .duo-dark img { width: 100%; height: 150px; margin-left: 0; border-radius: 4px; }
    }
    @media (max-width: 480px) {
      .pd-info h1 { font-size: 32px; }
      .pd-btns .btn { flex-basis: 100%; }
      .pd-meta { grid-template-columns: minmax(0, 1fr); }
      .pd-meta div + div { border-left: 0; border-top: 1px solid #e3e4e7; }
      .apps6 { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body data-nav="products" data-cta data-footer="plain"
  data-cta-title="Ready to upgrade your production?"
  data-cta-text="Request a personalized quote from our team and get the best solution for your woodworking needs."
  data-cta-note="It's fast, easy and commitment-free."
  data-cta-art="assets/img/product/cta-art.png">
  <div id="site-header"></div>
  <main id="page" class="container"></main>
  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("piston:ready", () => {
      const { D, qs, qsa, esc, param, product, productImg, catName } = P;
      const p = product(param("id")) || product("r32");
      const isR32 = p.id === "r32";
      const img = (n) => `assets/img/product/${n}.png`;
      document.title = `${p.model} ${p.name} — PISTON`;

      const strip = p.strip || p.specs.slice(0, 6).map(([k, v]) => [v, k]);
      const half = Math.floor(p.specs.length / 2);
      const overview = p.overview || [p.desc, "Engineered with premium components for long-term accuracy, low maintenance and operator safety."];
      const features = p.features || ["Heavy-duty construction for continuous industrial use.", "Precision components for accurate, repeatable results.", "Ergonomic controls for easy operation.", "Low maintenance design with easy access to service points."];
      const apps = p.apps || D.industries.filter((i) => p.industries.includes(i.slug)).map((i) => i.name).slice(0, 6);
      const related = [["peb368", "rel-peb368"], ["pbd21", "rel-pbd21"], ["pvpm2500", "rel-pvpm2500"], ["pj1300", "rel-pj1300"]].filter(([id]) => id !== p.id);
      const tabs = [["overview", "Overview"], ["specs", "Specifications"], ["features", "Features"], ["viewer", "360° Viewer"], ["apps", "Applications"], ["videos", "Videos"], ["docs", "Documents"], ["parts", "Spare Parts"]];

      qs("#page").innerHTML = `
      <div class="pd-crumb"><a href="index.html">Home</a><span>›</span><a href="products.html">Machinery</a><span>›</span><a href="products.html?cat=${p.cat}">${esc(catName(p.cat))}</a><span>›</span>${esc(p.model.replace("PISTON", "Piston"))}</div>

      <section class="pd-top">
        <div>
          <div class="pd-main" id="mainImg">${isR32 ? `<img src="${img("main")}" alt="${esc(p.model)}"><button class="pd-fs" title="Full Screen" onclick="document.getElementById('mainImg').requestFullscreen?.()?.catch(() => {})"></button>`
            : `<div style="aspect-ratio:2.05;display:grid;place-items:center;background:#f3f4f6">${productImg(p)}</div>`}</div>
          ${isR32 ? `<div class="pd-thumbs"><button class="arr" aria-label="Previous">‹</button>${[1, 2, 3, 4, 5].map((n) => `<button class="t ${n === 1 ? "on" : ""}" data-t="${n}"><img src="${img("thumb-" + n)}" alt=""></button>`).join("")}<button class="arr" aria-label="Next">›</button></div>` : ""}
        </div>
        <div class="pd-info">
          ${p.featured ? '<div class="pd-feat">☆ Featured Machine</div>' : ""}
          <h1>${esc(p.model)}</h1>
          <div class="sub">${esc(p.name)}</div>
          <p class="desc">${esc(p.longDesc || p.desc)}</p>
          <div class="pd-btns">
            <button class="btn btn-red" data-wa-quote data-items="${p.id}" data-source="Product page ${esc(p.model)}">Request a Quote &nbsp;→</button>
            <a class="btn btn-outline" href="#" onclick="P.toast('Datasheet PDF — demo');return false;">⤓ &nbsp;Download Datasheet</a>
          </div>
          <button class="pd-ql" data-quote-add="${p.id}">+ Add to quote list</button>
          <div class="pd-badges">
            ${[["Precision<br>Engineering"], ["Heavy-Duty<br>Construction"], ["Industrial<br>Performance"], ["Easy<br>Maintenance"]].map(([t], i) => `<div><img src="${img("badge-" + (i + 1))}" alt="">${t}</div>`).join("")}
          </div>
        </div>
      </section>

      <section class="pd-strip">${strip.map(([v, l], i) => `<div><img src="${img("strip-" + (i + 1))}" alt=""><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join("")}</section>

      <nav class="pd-tabs" id="pdTabs">${tabs.map(([id, t], i) => `<a href="#${id}" class="${i ? "" : "on"}"><img src="${img("tab-" + (i + 1))}" alt="">${t}</a>`).join("")}</nav>

      <section class="pd-row pd-ov" id="overview">
        <div class="pd-box"><h3>Overview</h3>${overview.map((t) => `<p>${esc(t)}</p>`).join("")}
          <div class="pd-meta"><div><img src="${img("flag-egypt")}" alt="">Made in Egypt<br>Main Motor</div><div><img src="${img("warranty")}" alt="">2 Years<br>Warranty</div></div></div>
        <div class="pd-viewer" id="viewer">
          <div class="pd-tools">
            <button id="vRot"><img src="${img("tool-rotate")}" alt="">Rotate</button>
            <button id="vZoom"><img src="${img("tool-zoom")}" alt="">Zoom</button>
            <button disabled title="Phase 2"><img src="${img("tool-measure")}" alt="">Measure</button>
            <button disabled title="Phase 2"><img src="${img("tool-exploded")}" alt="">Exploded</button>
            <button id="vReset"><img src="${img("tool-reset")}" alt="">Reset</button>
          </div>
          <div class="pd-mode"><button disabled title="Interactive 3D — Phase 2">3D</button><button class="on">360°</button><button disabled title="AR — Phase 2">AR</button></div>
          <div class="stage" id="stage">${isR32 || productImg(p).startsWith("<img") ? `<img id="spinImg" src="${isR32 ? img("viewer") : `assets/img/products/${p.id}.png`}" alt="${esc(p.model)} 360° view" draggable="false">` : `<div id="spinImg" style="width:70%;margin:auto">${productImg(p)}</div>`}</div>
          <button class="pd-full" aria-label="Fullscreen" onclick="document.getElementById('viewer').requestFullscreen?.()?.catch(() => {})">⛶</button>
        </div>
      </section>

      <section class="pd-row pd-fk" id="features">
        <div class="pd-box"><h3>Key Features</h3><ul>${features.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>
        <div class="pd-box" id="specs" style="border:0;padding:14px 0 0"><h3>Technical Specifications</h3>
          <div class="spec2"><div style="display:block;padding:0;border:0">${p.specs.slice(0, half).map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("")}</div>
            <div style="display:block;padding:0;border:0">${p.specs.slice(half).map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("")}</div></div>
          <p class="spec-note">* Specifications and design are subject to change without notice for improvement.</p></div>
      </section>

      <section class="pd-row pd-av">
        <div class="pd-box" id="apps"><h3>Applications</h3>
          <div class="apps6">${apps.map((a, i) => `<div><img src="${img("app-" + (i + 1))}" alt="">${esc(a)}</div>`).join("")}</div>
          <img src="${img("wood")}" alt="" style="width:100%;border-radius:3px"></div>
        <div class="pd-box" id="videos"><h3>Watch the Machine in Action</h3><p style="font-size:13px;margin:-8px 0 14px">See the ${esc(p.model)} in real production environments.</p>
          <a class="pd-video" href="videos.html"><img src="${img("video")}" alt="${esc(p.model)} video"></a></div>
      </section>

      <section style="margin-top:30px" id="docs">
        <h3 style="font-size:22px">You May Also Be Interested In</h3>
        <div class="rel"><button class="nav-arrow l" aria-label="Previous">‹</button>
          <div class="rel-grid">${related.map(([id, im]) => { const r = product(id); return `<div class="rel-card"><img src="${img(im)}" alt="${esc(r.model)}"><b>${esc(r.model)}</b><span>${esc(r.name)}</span><a class="more" href="product.html?id=${id}">View Details →</a></div>`; }).join("")}</div>
          <button class="nav-arrow r" aria-label="Next">›</button></div>
      </section>

      <section class="duo-dark" id="parts">
        <div><div><h3>Spare Parts</h3><p>Genuine parts for guaranteed performance and durability.</p><a class="btn btn-outline" href="spare-parts.html?id=${p.id}">Find Spare Parts &nbsp;→</a></div><img src="${img("parts-art")}" alt=""></div>
        <div><div><h3>Technical Support</h3><p>Our experts are ready to help you with installation, maintenance and technical inquiries.</p><a class="btn btn-outline" href="technical-support.html">Contact Support &nbsp;→</a></div><img src="${img("support-photo")}" alt=""></div>
      </section>`;

      // Tabs act as section anchors (all sections are visible, as in the mockup).
      const links = qsa("#pdTabs a");
      links.forEach((a) => a.addEventListener("click", () => { links.forEach((x) => x.classList.toggle("on", x === a)); }));
      qsa(".pd-thumbs .t").forEach((b) => b.onclick = () => { qsa(".pd-thumbs .t").forEach((x) => x.classList.toggle("on", x === b)); qs("#mainImg img").src = img(b.dataset.t === "1" ? "main" : "thumb-" + b.dataset.t); });
      qsa(".pd-thumbs .arr").forEach((a, i) => a.onclick = () => { const t = qsa(".pd-thumbs .t"), on = t.findIndex((x) => x.classList.contains("on")); t[(on + (i ? 1 : t.length - 1)) % t.length].click(); });

      // Simple 360° interaction on the viewer image.
      let ang = 0, zoom = 1, drag = null;
      const spin = qs("#spinImg"), stage = qs("#stage");
      const draw = () => { const c = Math.cos(ang * Math.PI / 180); spin.style.transform = `scale(${zoom}) scaleX(${Math.sign(c || 1) * Math.max(0.3, Math.abs(c))})`; };
      stage.addEventListener("pointerdown", (e) => { drag = e.clientX; stage.setPointerCapture(e.pointerId); });
      stage.addEventListener("pointermove", (e) => { if (drag === null) return; ang += (e.clientX - drag) * 0.6; drag = e.clientX; draw(); });
      stage.addEventListener("pointerup", () => (drag = null));
      let t = null;
      qs("#vRot").onclick = () => { if (t) { clearInterval(t); t = null; } else t = setInterval(() => { ang += 2; draw(); }, 30); };
      qs("#vZoom").onclick = () => { zoom = zoom >= 1.5 ? 1 : zoom + 0.25; draw(); };
      qs("#vReset").onclick = () => { ang = 0; zoom = 1; if (t) { clearInterval(t); t = null; } draw(); };
    });
  </script>
</body>
</html>
